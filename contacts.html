        tailwind.config = {

            theme: {

    <style>
        /* --- Core Styles --- */
        :root {
            --cursor-size: 20px;
        }

        body {
            background-color: #050511;
            color: #e2e8f0;
            overflow-x: hidden;
            /* Custom cursor active only on non-touch */
            cursor: auto; 
        }

        /* Desktop Only: Custom Cursor */
        @media (hover: hover) and (pointer: fine) {
            body { cursor: none; }
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10; /* Low Z-index so it sits behind interactive elements but over bg */
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- Custom Cursor --- */
        #cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #00f3ff;
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            display: none;
        }

        #cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            display: none;
        }
        
        @media (hover: hover) and (pointer: fine) {
            #cursor-dot, #cursor-outline { display: block; }
        }
        
        .glass-panel {
            background: rgba(15, 17, 38, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .text-outline {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
            color: transparent;
            transition: all 0.3s ease;
        }

        /* --- Animations --- */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        
        .reveal-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="antialiased selection:bg-brand-accent selection:text-brand-dark">

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             // Robust scroll reveal logic
             const revealElements = document.querySelectorAll('.reveal-on-scroll');
             const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('is-visible');
                });
            }, { threshold: 0.1 });
            revealElements.forEach(el => observer.observe(el));
            setTimeout(() => revealElements.forEach(el => el.classList.add('is-visible')), 500);

            // Custom Cursor Logic - Desktop Only
            if (typeof gsap !== 'undefined' && window.matchMedia("(hover: hover)").matches) {
                const dot = document.getElementById('cursor-dot');
                const outline = document.getElementById('cursor-outline');
                
                window.addEventListener('mousemove', e => {
                    gsap.to(dot, { x: e.clientX, y: e.clientY, duration: 0.1 });
                    gsap.to(outline, { x: e.clientX, y: e.clientY, duration: 0.5 });
                });
            }

             // Mobile Menu
             const btn = document.getElementById('menu-btn');
             const menu = document.getElementById('mobile-menu');
             const close = document.getElementById('close-menu');
             const links = document.querySelectorAll('.mobile-link');
             
            const toggle = () => menu.classList.toggle('translate-x-full');
            
            if(btn) btn.addEventListener('click', toggle);
            if(close) close.addEventListener('click', toggle);
            links.forEach(link => link.addEventListener('click', toggle));
        });
    </script>
